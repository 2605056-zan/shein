<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chilli 鍋 企画発表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@500;700;900&family=Shippori+Mincho+B1:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --red:#D91E2B;--redd:#A81420;--flame:#FF7A1A;--amber:#F2B233;--wine:#6E1A22;
  --ink:#241A1C;--mute:#6B5B5D;--blush:#FFF1EC;--blush2:#FFE0D6;--line:#F1D8D0;
  --ok:#1E8E5A;--warn:#E59A00;--grey:#9A8F91;
  --disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --dw:900;
}
html,body{height:100%;margin:0;background:#150F10;font-family:var(--body);font-weight:700;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#main{flex:1;display:flex;min-height:0;min-width:0}
#viewport{position:relative;overflow:hidden;flex:1;min-width:0;min-height:0;background:#150F10}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#fff;overflow:hidden;user-select:none}
.m-edit #stage{user-select:text}
#slide{position:absolute;inset:0}
.slide{position:absolute;inset:0;overflow:hidden}
.th-light{background:#fff;color:var(--ink)}
.th-blush{background:var(--blush);color:var(--ink)}
.th-red{background:var(--red);color:#fff}
.th-ink{background:var(--ink);color:#fff}
.disp{font-family:var(--disp);font-weight:var(--dw)}
[data-e]{white-space:pre-line}
.slide{word-break:auto-phrase;line-break:strict}
.editing [data-e]{outline:3px dashed rgba(217,30,43,.4);outline-offset:6px;cursor:text;border-radius:6px}
.editing [data-e]:hover,.editing [data-e]:focus{outline-color:#D91E2B;background:rgba(255,200,180,.28)}
.th-red.editing [data-e]{outline-color:rgba(255,255,255,.7)}
/* reveal system */
.rv{opacity:0;transform:translateY(40px);transition:opacity .45s ease,transform .65s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.rv.in{opacity:1;transform:none;pointer-events:auto}
.noanim,.noanim *{transition:none!important;animation:none!important}
@keyframes pin-f{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes pin-b{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
.enter-f{animation:pin-f .4s cubic-bezier(.2,.8,.2,1)}
.enter-b{animation:pin-b .4s cubic-bezier(.2,.8,.2,1)}
/* header + hero */
.ph{position:absolute;left:0;right:0;top:46px;text-align:center;font:var(--dw) 60px/1.2 var(--disp);color:var(--red)}
.th-red .ph,.th-ink .ph{color:#fff}
.hero{position:absolute;left:0;top:0;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  transition:transform .75s cubic-bezier(.2,.8,.2,1);z-index:6;pointer-events:none}
.hero>*{pointer-events:auto}
.hero.dock{transform:translateY(-450px) scale(.56)}
.hero-t{font:var(--dw) 124px/1.25 var(--disp);color:var(--red);padding:0 80px}
.hero-t.long{font-size:92px}
.hero-s{font:700 52px/1.4 var(--body);color:var(--mute);margin-top:18px;transition:opacity .3s}
.hero.dock .hero-s{opacity:0}
.th-red .hero-t,.th-ink .hero-t{color:#fff}
#ind{position:absolute;right:56px;bottom:30px;font:700 28px/1 var(--body);color:var(--mute);letter-spacing:.02em;z-index:50;pointer-events:none}
#stage[data-th=red] #ind,#stage[data-th=ink] #ind{color:rgba(255,255,255,.85)}
/* ---- title ---- */
.t-art{position:absolute;right:-70px;top:70px;width:1000px;height:1000px;border-radius:50%;background:var(--flame);overflow:hidden;display:flex;align-items:center;justify-content:center}
.t-img{width:100%;height:100%;object-fit:cover}
.svgbox{display:flex;align-items:center;justify-content:center}
.svgbox svg{width:100%;height:100%}
.t-event{position:absolute;left:110px;top:70px;font:700 36px/1.3 var(--body);color:rgba(255,255,255,.9)}
.t-brand{position:absolute;left:100px;top:270px;font-size:210px;line-height:1.1;color:#fff}
.t-tag{position:absolute;left:112px;top:560px;font:900 78px/1.3 var(--body);color:#fff}
.t-team{position:absolute;left:110px;top:730px;right:110px;display:flex;align-items:center;gap:56px}
.t-teamname{font:var(--dw) 58px/1.2 var(--disp);color:#fff;flex:none}
.t-course{font:700 36px/1.3 var(--body);color:#fff;margin-top:8px}
.t-members{display:flex;gap:24px;margin-left:auto}
.t-mem{background:#fff;color:var(--ink);border-radius:32px;padding:22px 34px;min-width:250px;text-align:center;box-shadow:0 10px 30px rgba(90,0,10,.28)}
.t-mem .n{font:var(--dw) 58px/1.2 var(--disp);color:var(--red)}
.t-mem .r{font:700 28px/1.3 var(--body);color:var(--mute);margin-top:4px}
/* ---- sequence ---- */
.sq-card{position:absolute;left:50%;top:640px;width:820px;height:560px;margin-left:-410px;margin-top:-280px;border-radius:64px;background:#fff;border:8px solid var(--red);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;color:var(--red);
  box-shadow:0 26px 60px rgba(150,20,30,.18);transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .6s ease,background .6s,color .6s}
.sq-card.on{background:var(--red);color:#fff;box-shadow:0 30px 70px rgba(150,20,30,.38)}
.sq-n{position:absolute;left:38px;top:30px;width:84px;height:84px;border-radius:50%;background:var(--red);color:#fff;font:var(--dw) 46px/84px var(--disp);text-align:center;transition:background .6s,color .6s}
.sq-card.on .sq-n{background:#fff;color:var(--red)}
.sq-ic{width:210px;height:210px;border-radius:50%;background:var(--blush);display:flex;align-items:center;justify-content:center;color:var(--red);margin-bottom:22px;transition:background .6s,color .6s}
.sq-card.on .sq-ic{background:rgba(255,255,255,.18);color:#fff}
.sq-t{font:var(--dw) 64px/1.25 var(--disp)}
.sq-s{font:700 40px/1.4 var(--body);margin-top:14px;opacity:.9}
/* ---- panels ---- */
.tabs{position:absolute;left:0;right:0;top:170px;display:flex;justify-content:center;gap:20px}
.tab{padding:14px 40px;border-radius:999px;background:var(--blush);color:var(--mute);font:900 38px/1.2 var(--body);transition:background .4s,color .4s;border:4px solid transparent}
.tab.on{background:var(--red);color:#fff}
.pnl{position:absolute;left:80px;right:80px;top:290px;height:700px;display:flex;align-items:stretch;justify-content:center;gap:36px;
  transition:transform .75s cubic-bezier(.2,.8,.2,1),opacity .5s ease}
.tile{flex:1;min-width:0;border-radius:52px;background:#fff;border:6px solid var(--line);box-shadow:0 18px 44px rgba(150,20,30,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 22px;gap:18px}
.tile-ic{width:150px;height:150px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.tile-n{font:var(--dw) 46px/1.3 var(--disp);color:var(--ink)}
.tile-tag{font:900 30px/1.2 var(--body);background:var(--blush2);color:var(--redd);border-radius:999px;padding:8px 22px}
.chips{display:flex;flex-direction:column;gap:12px;align-items:stretch;width:100%;margin-top:6px}
.chip{display:flex;align-items:center;gap:14px;background:var(--blush);border-radius:22px;padding:10px 16px;font:900 38px/1.2 var(--body);text-align:left}
.mono{flex:none;min-width:58px;height:58px;border-radius:16px;color:#fff;font:900 24px/58px var(--body);text-align:center;padding:0 6px}
.tile-b{display:flex;flex-direction:column;align-items:center;gap:18px;min-width:0;width:100%}
.pnl.g2{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:36px}
.pnl.g2 .tile{flex-direction:row;justify-content:flex-start;text-align:left;gap:40px;padding:30px 48px}
.pnl.g2 .tile-b{align-items:flex-start;width:auto;flex:1}
.pnl.g2 .tile-n{font-size:52px}
.pnl.g2 .tile-ic{width:180px;height:180px}
.pnl.g2 .chips{flex-direction:row;flex-wrap:wrap}
.pnl.g2 .chip{font-size:36px}
.pnl.flow .tile-n{font-size:38px}
.pnl.flow .tile-tag{font-size:26px;padding:8px 14px}
.arrow{flex:none;width:64px;display:flex;align-items:center;justify-content:center;color:var(--red)}
.pnl.flow{gap:0}
.pnl.flow .tile{flex:1}
/* ---- problems ---- */
.pb-grid{position:absolute;left:80px;right:80px;top:230px;bottom:70px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:36px}
.pb-card{position:relative;border-radius:52px;background:#fff;border:6px solid var(--line);padding:34px 44px 30px 44px;box-shadow:0 14px 36px rgba(150,20,30,.10);transition:opacity .5s ease,transform .7s cubic-bezier(.2,.8,.2,1),border-color .4s,box-shadow .4s}
.pb-card.focus{border-color:var(--red);box-shadow:0 26px 60px rgba(217,30,43,.28);transform:scale(1.025)}
.pb-top{display:flex;align-items:center;gap:22px}
.pb-n{width:88px;height:88px;border-radius:50%;background:var(--red);color:#fff;font:var(--dw) 52px/88px var(--disp);text-align:center;flex:none}
.pb-t{font:var(--dw) 48px/1.25 var(--disp);color:var(--ink);flex:1}
.pb-ic{width:88px;height:88px;border-radius:50%;background:var(--blush);color:var(--red);display:flex;align-items:center;justify-content:center;flex:none}
.pb-p{font:700 40px/1.4 var(--body);margin-top:14px;display:flex;flex-direction:column;gap:2px}
.pb-p div:before{content:"";display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--red);margin-right:16px;vertical-align:middle;transform:translateY(-3px)}
/* ---- persona ---- */
.pe-photo{position:absolute;left:80px;top:170px;width:760px;height:830px;border-radius:64px;overflow:hidden;box-shadow:0 26px 60px rgba(150,20,30,.25)}
.pe-photo img{width:100%;height:100%;object-fit:cover;object-position:46% 50%}
.pe-photo .svgbox{width:100%;height:100%;background:var(--flame)}
.pe-col{position:absolute;left:900px;right:80px;top:170px;height:830px}
.pe-blk{position:absolute;left:0;right:0}
.pe-name{font:var(--dw) 128px/1.1 var(--disp);color:var(--red)}
.pe-pills{display:flex;gap:16px;margin-top:22px;flex-wrap:wrap}
.pill{border-radius:999px;background:var(--red);color:#fff;font:900 46px/1.2 var(--body);padding:12px 34px}
.pill.soft{background:var(--blush2);color:var(--redd);font-size:40px;padding:10px 28px}
.pill.o{background:#fff;color:var(--ink);border:5px solid var(--line);font-size:40px;padding:8px 26px}
.pe-lab{font:900 36px/1.2 var(--body);color:var(--mute);margin-bottom:12px}
.pe-card{position:absolute;inset:0;border-radius:56px;padding:64px 64px;display:flex;flex-direction:column;justify-content:center;gap:26px}
.pe-card.pain{background:var(--red);color:#fff}
.pe-card.why{background:#fff;color:var(--ink);border:8px solid var(--ok)}
.pe-tag{align-self:flex-start;border-radius:999px;background:#fff;color:var(--red);font:900 42px/1.2 var(--body);padding:10px 30px}
.pe-card.why .pe-tag{background:var(--ok);color:#fff}
.pe-big{font:var(--dw) 64px/1.35 var(--disp)}
.pe-mid{font:900 50px/1.4 var(--body);opacity:.95}
/* ---- story ---- */
.st-col{position:absolute;left:100px;top:190px;width:900px;height:820px;display:flex;flex-direction:column;gap:30px;justify-content:center}
.st-hero{font:var(--dw) 100px/1.28 var(--disp);color:var(--ink)}
.st-pt{display:flex;align-items:center;gap:26px;font:900 54px/1.35 var(--body)}
.st-ck{flex:none;width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center}
.st-close{background:var(--red);color:#fff;border-radius:44px;padding:28px 44px;font:900 56px/1.35 var(--body)}
.st-photo{position:absolute;right:80px;top:170px;width:780px;height:830px;border-radius:72px;overflow:hidden;box-shadow:0 26px 60px rgba(150,20,30,.25);background:var(--flame)}
.st-photo img,.st-photo .svgbox{width:100%;height:100%;object-fit:cover}
/* ---- compare ---- */
.cmp{position:absolute;left:80px;top:190px;width:1760px}
.cmp-g{display:grid;grid-template-columns:560px repeat(4,300px);position:relative}
.cmp-h{height:130px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;border-radius:30px 30px 0 0;font:var(--dw) 42px/1.2 var(--disp);margin:0 6px;padding:0 10px;background:linear-gradient(180deg,#6C5A5D,#3D3032)}
.cmp-h.us{background:linear-gradient(180deg,#FF6A3D,#D91E2B);font-size:52px;margin-top:-20px;height:150px;box-shadow:0 18px 36px rgba(217,30,43,.35)}
.cmp-l{height:110px;display:flex;align-items:center;font:900 42px/1.2 var(--body);border-bottom:4px dashed var(--line);padding-left:10px}
.cmp-c{height:110px;display:flex;align-items:center;justify-content:center;border-bottom:4px dashed var(--line);margin:0 6px}
.cmp-c.us{background:linear-gradient(180deg,#FFE6DD,#FFF6F2)}
.cmp-c.first{}
.stag{opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i)*.14s + .2s)}
.rv.in .stag{opacity:1;transform:none}
.legend{display:flex;gap:44px;margin-top:34px;justify-content:center;font:900 32px/1 var(--body);color:var(--mute);align-items:center}
.legend span{display:flex;align-items:center;gap:12px}
.ct{position:absolute;left:80px;right:80px;top:180px;bottom:80px;display:flex;gap:44px;align-items:stretch}
.ct-p{border-radius:60px;padding:44px 50px;display:flex;flex-direction:column;gap:18px}
.ct-p.o{flex:0 0 700px;background:#EDEFF3;color:#3B4252}
.ct-p.u{flex:1;background:var(--red);color:#fff;box-shadow:0 26px 60px rgba(217,30,43,.35)}
.ct-h{font:var(--dw) 64px/1.2 var(--disp);text-align:center;margin-bottom:12px}
.ct-i{display:flex;align-items:center;gap:22px;font:900 46px/1.25 var(--body)}
.ct-i .ci{flex:none;width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ct-p.o .ci{background:#fff;color:#7B8497}
.ct-p.u .ci{background:#fff;color:var(--red)}
/* ---- schedule ---- */
.sc{position:absolute;left:80px;top:180px;width:1760px}
.sc-h{display:grid;grid-template-columns:560px 200px repeat(3,334px);gap:0}
.sc-m{height:84px;display:flex;align-items:center;justify-content:center;font:var(--dw) 46px/1 var(--disp);color:#fff;transition:filter .4s,transform .4s;background:#8C7E80}
.sc-m.m0{background:#E8577A;border-radius:24px 0 0 0}.sc-m.m1{background:#F08A2E}.sc-m.m2{background:#3C86D6;border-radius:0 24px 0 0}
.sc-m.dim{filter:saturate(.35) brightness(1.1)}
.sc-hh{display:grid;grid-template-columns:760px repeat(6,167px);height:56px;font:900 30px/56px var(--body);color:var(--mute);text-align:center;background:var(--blush)}
.sc-r{display:grid;grid-template-columns:560px 200px 1000px;height:78px;align-items:center;border-bottom:3px solid var(--line);position:relative}
.sc-r:nth-child(even){background:#FFF8F5}
.sc-n{font:900 34px/1.2 var(--body);padding-left:16px}
.sc-o{display:inline-block;font:900 30px/1 var(--body);color:#fff;border-radius:999px;padding:9px 0;text-align:center;width:130px}
.sc-t{position:relative;height:100%;background-image:linear-gradient(90deg,transparent 166px,var(--line) 166px,var(--line) 168px,transparent 168px);background-size:167px 100%}
.sc-b{position:absolute;top:17px;height:44px;border-radius:22px;transition:clip-path 1s cubic-bezier(.2,.8,.2,1)}
/* ---- ending ---- */
.en{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px}
.en-q{font:var(--dw) 220px/1.2 var(--disp)}
.en-t{font:var(--dw) 118px/1.35 var(--disp)}
.en-s{font:900 48px/1.4 var(--body);opacity:.92}
/* ---- statement ---- */
.sm-h{position:absolute;left:120px;right:120px;top:200px;text-align:center;font:var(--dw) 110px/1.3 var(--disp);color:var(--ink)}
.sm-p{position:absolute;left:120px;right:120px;top:520px;display:flex;flex-direction:column;gap:26px}
.sm-i{background:var(--red);color:#fff;border-radius:44px;padding:26px 46px;font:900 58px/1.35 var(--body)}
/* ---- money ---- */
.mh{position:absolute;left:0;right:0;top:150px;text-align:center;font:var(--dw) 78px/1.2 var(--disp);color:var(--ink)}
.ms{position:absolute;inset:0}
.ms-b{position:absolute;left:80px;right:80px;top:290px;bottom:80px}
.dn-wrap{display:flex;align-items:center;justify-content:center;gap:110px;height:100%}
.dn{position:relative;width:640px;height:640px;flex:none}
.dn svg{width:100%;height:100%}
.dn circle{stroke-width:88;transition:stroke-dasharray .8s ease}
.dn-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dn-cb{font:var(--dw) 74px/1.1 var(--disp);color:var(--ink)}
.dn-cs{font:900 38px/1.3 var(--body);color:var(--mute);margin-top:8px}
.lg-w{display:flex;flex-direction:column;gap:22px;flex:1;max-width:900px}
.lg{display:flex;align-items:center;gap:22px;font:900 48px/1.2 var(--body)}
.lg i{flex:none;width:42px;height:42px;border-radius:12px}
.lg .ln{flex:1}
.lg .lv{font:var(--dw) 56px/1 var(--disp)}
.lg .lp{font:900 34px/1 var(--body);color:var(--mute);min-width:96px;text-align:right}
.colarea{display:flex;align-items:flex-end;justify-content:center;gap:120px;height:560px;margin-top:0}
.cgroup{display:flex;flex-direction:column;align-items:center;width:420px}
.cbars{display:flex;gap:22px;align-items:flex-end;height:520px;width:100%;justify-content:center}
.colw{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;width:180px}
.cnum{font:var(--dw) 50px/1.1 var(--disp);margin-bottom:10px;white-space:nowrap}
.bar{width:100%;height:0;border-radius:22px 22px 0 0}
.bar.sales{background:linear-gradient(180deg,#FF9440,#FF7A1A)}
.bar.profit{background:linear-gradient(180deg,#38B57B,#1E8E5A)}
.cnum.sales{color:#D25F00}.cnum.profit{color:var(--ok)}
.clab{margin-top:22px;text-align:center}
.corders{font:var(--dw) 54px/1.2 var(--disp);color:var(--red)}
.cph{font:900 36px/1.3 var(--body);color:var(--mute);margin-top:6px}
.cap{position:absolute;left:0;right:0;bottom:0;text-align:center;font:900 40px/1.3 var(--body);color:var(--mute)}
.cum-w{display:flex;gap:56px;height:100%}
.cum{position:relative;flex:1}
.cum-area{position:absolute;left:0;right:0;top:0;bottom:80px;display:flex;align-items:flex-end;gap:22px}
.cum-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.cum-col .cnum{font-size:38px}
.cum-lab{position:absolute;left:0;right:0;bottom:0;display:flex;gap:22px;height:70px}
.cum-lab div{flex:1;text-align:center;font:900 34px/70px var(--body);color:var(--mute)}
.inv-line{position:absolute;left:-10px;right:-10px;border-top:6px dashed var(--red);z-index:3}
.inv-line span{position:absolute;left:0;top:-58px;background:var(--red);color:#fff;font:900 32px/1 var(--body);padding:10px 20px;border-radius:14px}
.cum-side{flex:0 0 560px;display:flex;flex-direction:column;gap:30px;justify-content:center}
.big{border-radius:48px;padding:34px 40px}
.big.g{background:var(--ok);color:#fff}
.big.w{background:var(--blush);color:var(--ink)}
.big .k{font:900 40px/1.3 var(--body)}
.big .v{font:var(--dw) 108px/1.15 var(--disp)}
.big .d{font:900 38px/1.4 var(--body);opacity:.95}
.cs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:34px;height:100%;grid-template-rows:1fr 1fr}

  if(m==='part')return '<svg width="78" height="78" viewBox="0 0 78 78"><path d="M39 10L69 62H9z" fill="none" stroke="#E59A00" stroke-width="9" stroke-linejoin="round"/></svg>';

/* =========================================================
   共通: 画像 / 数値アニメーション
   ========================================================= */
let data;                       // 現在の編集対象データ
const S={mode:'present',pid:null,st:0,prev:null,dirty:false};

function imageSrc(key){const im=data.images&&data.images[key];return (im&&im.src)||DEFIMG[key]||''}
function imgHTML(key,cls,fb){const s=imageSrc(key);return s?`<img class="${cls||''}" src="${s}" alt="">`:`<div class="${cls||''} svgbox">${fb?fb():potSVG()}</div>`}

function numText(el,v){const d=+el.dataset.dec||0;const s=el.dataset.suf||'';return (d?v.toFixed(d):String(Math.round(v)))+s}
function tween(el,to,ms,delay,from){
  from=from||0;const t0=performance.now()+(delay||0);el._tw=(el._tw||0)+1;const id=el._tw;
  requestAnimationFrame(function f(t){if(el._tw!==id)return;const k=clamp((t-t0)/ms,0,1),e=1-Math.pow(1-k,3);el.textContent=numText(el,from+(to-from)*e);if(k<1)requestAnimationFrame(f)});
}
function runAnim(box,st,mode){
  const all=$$('[data-bar],[data-dash],[data-count]',box);
  const lv=x=>x.dataset.lvl==null?0:+x.dataset.lvl;
  const setFinal=x=>{if(x.dataset.bar!=null){x.style.transition='none';x.style.height=(x.dataset.bar*100)+'%'}
    if(x.dataset.dash!=null){x.style.transition='none';x.style.strokeDasharray=x.dataset.dash+' '+x.dataset.c}
    if(x.dataset.count!=null){x._tw=(x._tw||0)+1;x.textContent=numText(x,+x.dataset.count)}};
  const setZero=x=>{if(x.dataset.bar!=null){x.style.transition='none';x.style.height='0'}
    if(x.dataset.dash!=null){x.style.transition='none';x.style.strokeDasharray='0 '+x.dataset.c}
    if(x.dataset.count!=null){x._tw=(x._tw||0)+1;x.textContent=numText(x,0)}};
  if(mode==='instant'){all.forEach(x=>lv(x)<=st?setFinal(x):setZero(x));return}
  let targets;
  if(mode==='fresh'){all.forEach(setZero);targets=all.filter(x=>lv(x)<=st)}
  else if(mode==='fwd'){targets=all.filter(x=>lv(x)===st&&lv(x)>0)}
  else{all.filter(x=>lv(x)>st).forEach(setZero);return}
  void box.offsetWidth;
  const n={bar:0,dash:0,count:0};
  targets.forEach(x=>{
    if(x.dataset.bar!=null){x.style.transition=`height .9s cubic-bezier(.2,.8,.2,1) ${n.bar++*.07}s`;x.style.height=(x.dataset.bar*100)+'%'}
    if(x.dataset.dash!=null){x.style.transition=`stroke-dasharray .8s ease ${n.dash++*.16}s`;x.style.strokeDasharray=x.dataset.dash+' '+x.dataset.c}
    if(x.dataset.count!=null){tween(x,+x.dataset.count,900,n.count++*70)}
  });
}

function moneyModel(c){
  const inv=c.invest.items.reduce((a,x)=>a+(+x.value||0),0);
  const pf=c.costs.items.find(x=>x.profit),pr=(pf?+pf.value:20)/100;
  const mo=o=>o*c.sim.avgOrder*c.sim.days/10000;
  const ph=c.sim.phases.map(x=>({label:x.label,orders:+x.orders,months:+x.months,sales:mo(+x.orders),profit:mo(+x.orders)*pr}));
  const H=clamp(Math.round(c.payback.horizon)||8,1,24),cum=[];let acc=0;
  for(let m=1;m<=H;m++){let cur=ph[ph.length-1],t=0;for(const x of ph){t+=x.months;if(x.months>0&&m<=t){cur=x;break}}acc+=cur.profit;cum.push(acc)}
  const be=cum.findIndex(v=>v>=inv-1e-9)+1;
  const cm=mo(+c.cons.orders),cp=cm*(+c.cons.months)*pr;
  return{inv,pr,ph,cum,be,H,cons:{daily:(+c.cons.orders)*c.sim.avgOrder/10000,month:cm,total:cm*(+c.cons.months),profit:cp,left:inv-cp},
    per:(ph.length?ph[ph.length-1].profit:0)/Math.max(1,+c.sim.members||1)};
}
function donutSVG(vals,cols){
  const R=170,C=2*Math.PI*R,tot=vals.reduce((a,b)=>a+b,0)||1;let off=0;
  return `<svg viewBox="0 0 460 460"><g transform="rotate(-90 230 230)">`+vals.map((v,i)=>{const len=v/tot*C;
    const s=`<circle cx="230" cy="230" r="${R}" fill="none" stroke="${cols[i]}" stroke-width="104" stroke-dasharray="0 ${C}" stroke-dashoffset="${-off}" data-dash="${Math.max(len-4,0)}" data-c="${C}"/>`;off+=len;return s}).join('')+`</g></svg>`;
}
const INVC=['#D91E2B','#FF7A1A','#F2B233','#7E2230','#3D3032','#1E8E5A','#6DB7F5','#B58CF0'];
function donutBlock(items,cols,big,sub,unit,pct,b,key){
  const tot=items.reduce((a,x)=>a+(+x.value||0),0)||1;
  const lg=items.map((x,i)=>`<div class="lg"><i style="background:${cols[i]}"></i><span class="ln" data-e="${b}.${key}.items.${i}.name">${esc(x.name)}</span><span class="lv" data-count="${+x.value||0}" data-dec="${decOf(+x.value||0)}" data-suf="${unit}">${fmt(+x.value||0)}${unit}</span>${pct?`<span class="lp">${Math.round((+x.value||0)/tot*1000)/10}%</span>`:''}</div>`).join('');
  return `<div class="dn-wrap"><div class="dn">${donutSVG(items.map(x=>+x.value||0),cols)}<div class="dn-c"><div class="dn-cb" data-count="${big.v}" data-dec="${decOf(big.v)}" data-suf="${big.suf}">${fmt(big.v)}${big.suf}</div><div class="dn-cs" data-e="${b}.${key}.title">${esc(sub)}</div></div></div><div class="lg-w">${lg}</div></div>`;
}

/* ---- スケジュール (日付で編集できるガント) ---- */
const pd=s=>{const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s||''));return m?{y:+m[1],m:+m[2],d:+m[3]}:null};
const dim=(y,m)=>new Date(y,m,0).getDate();
function ganttMonths(c){
  let a=pd(c.range&&c.range.start)||{y:2026,m:10,d:1},z=pd(c.range&&c.range.end)||{y:a.y,m:a.m+2,d:1};
  const key=d=>d.y*12+d.m;(c.rows||[]).forEach(r=>{const s=pd(r.start),e=pd(r.end);if(s&&key(s)<key(a))a=s;if(e&&key(e)>key(z))z=e;if(s&&key(s)>key(z))z=s});
  const out=[];let y=a.y,m=a.m;for(let k=0;k<24;k++){out.push({y,m});if(y===z.y&&m===z.m)break;if(y>z.y||(y===z.y&&m>z.m))break;m++;if(m>12){m=1;y++}}
  return out;
}
function ganttX(c,ms,s,isEnd,mw){
  let d=pd(s);
  if(!d&&typeof s==='number'){/* 旧データ(半月単位)にも対応 */const h=clamp(s,0,ms.length*2);const i=Math.min(ms.length-1,Math.floor(h/2));return (i+(h-i*2)/2)*mw}
  if(!d)return 0;
  const i=ms.findIndex(x=>x.y===d.y&&x.m===d.m);
  if(i<0){const f=ms[0],l=ms[ms.length-1];return (d.y*12+d.m<f.y*12+f.m)?0:ms.length*mw}
  const n=dim(d.y,d.m);return (i+clamp((d.d-1+(isEnd?1:0))/n,0,1))*mw;
}
const md=s=>{const d=pd(s);return d?`${d.m}/${d.d}`:''};
PT.gantt={
  labels:c=>['計画の枠',...ganttMonths(c).map(x=>x.m+'月')],
  render(p,b){const c=p.content,ms=ganttMonths(c),n=ms.length,W=1000,mw=W/n,u=mw/2;const oc={};c.owners.forEach(o=>oc[o.name]=o.color);
    const head=`<div class="sc-h" style="grid-template-columns:560px 200px repeat(${n},${mw}px)"><div></div><div></div>${ms.map((m,i)=>`<div class="sc-m" data-m="${i}" style="background:${MPAL[i%MPAL.length]};border-radius:${i===0?'24px ':'0 '}${i===n-1?'24px ':'0 '}0 0">${m.m}月</div>`).join('')}</div>`;
    const hh=`<div class="sc-hh" style="grid-template-columns:760px repeat(${n*2},${u}px)"><div></div>${ms.map(()=>c.halves.map(h=>`<div>${esc(h)}</div>`).join('')).join('')}</div>`;
    const rows=c.rows.map((r,i)=>{const x1=ganttX(c,ms,r.start,false,mw),x2=Math.max(x1,ganttX(c,ms,r.end,true,mw)),w=x2-x1;
      const lab=c.showDates!==false&&pd(r.start)&&pd(r.end)?`${md(r.start)}〜${md(r.end)}`:'';
      const inside=w>=190,right=x2+14+150<=W;
      const pos=inside?`left:${x1+16}px`:(right?`left:${x2+14}px`:`right:${W-x1+14}px`);
      return `<div class="sc-r" style="grid-template-columns:560px 200px ${W}px"><div class="sc-n" data-e="${b}.rows.${i}.name">${esc(r.name)}</div>
      <div><span class="sc-o" style="background:${oc[r.owner]||'#3D3032'}">${esc(r.owner)}</span></div>
      <div class="sc-t" style="background-size:${u}px 100%;background-image:linear-gradient(90deg,transparent ${u-2}px,var(--line) ${u-2}px)"><div class="sc-b" data-a="${x1}" data-b="${x2}" style="left:${x1}px;width:${w}px;background:${r.color||'#F58BA9'};clip-path:inset(0 100% 0 0 round 22px)"></div>${lab?`<div class="sc-d${inside?' in-bar':''}" style="${pos}">${lab}</div>`:''}</div></div>`}).join('');
    return `<div class="sc">${head}${hh}${rows}</div>`},
  apply(root,p,st){const n=ganttMonths(p.content).length,lim=(S.mode==='edit'?n:st)*(1000/n);
    $$('.sc-b',root).forEach(el=>{const a=+el.dataset.a,e=+el.dataset.b;const f=e>a?clamp((lim-a)/(e-a),0,1):0;el.style.clipPath=`inset(0 ${(1-f)*100}% 0 0 round 22px)`;
      const d=el.nextElementSibling;if(d&&d.classList.contains('sc-d'))d.classList.toggle('on',f>=.999)});
    $$('.sc-m',root).forEach(el=>el.classList.toggle('dim',S.mode!=='edit'&&st>0&&(+el.dataset.m)>=st))}

const D={ing:[],soup:null,flavor:null,spicy:null,friend:null,shared:false,pend:null,timers:[],tot:0};
function demoReset(){D.timers.forEach(clearTimeout);D.timers=[];D.ing=[];D.soup=null;D.flavor=null;D.spicy=null;D.friend=null;D.shared=false;D.pend=null;D.tot=0}
const allIng=c=>[].concat.apply([],c.categories.map(x=>x.items));
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
function demoTotal(c){const all=allIng(c);return (+c.basePrice||0)+D.ing.reduce((s,id)=>{const it=all.find(x=>x.id===id);return s+(it?+it.price:0)},0)}
function defaultFriend(c){const f=c.friends.find(x=>x.id===c.preset.friend)||c.friends[0];return f?f.id:null}
function tweenYen(el,from,to){el._ty=(el._ty||0)+1;const id=el._ty,t0=performance.now();
  requestAnimationFrame(function f(t){if(el._ty!==id)return;const k=clamp((t-t0)/380,0,1),e=1-Math.pow(1-k,3);el.textContent=yen(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})}
function syncChips(box,want,all,none){
  if(!box)return;
  $$('span[data-id]',box).forEach(s=>{if(!want.includes(s.dataset.id))s.remove()});
  want.forEach(id=>{if(!box.querySelector(`span[data-id="${id}"]`)){const it=all.find(x=>x.id===id);const s=document.createElement('span');s.dataset.id=id;s.textContent=it.name;box.appendChild(s)}});
  const ph=box.querySelector('.none');
  if(none&&want.length===0&&!ph){const s=document.createElement('span');s.className='none';s.style.cssText='background:none;color:#B5A6A8;padding:0;animation:none';s.textContent=none;box.appendChild(s)}
  if(want.length>0&&ph)ph.remove();
}
function demoUpdate(root,c){
  const T=c.text,all=allIng(c),none=`<span style="color:#B5A6A8">${esc(T.rcNone)}</span>`;
  $$('[data-act=ing]',root).forEach(e=>e.classList.toggle('sel',D.ing.includes(e.dataset.id)));
  $$('[data-act=soup]',root).forEach(e=>e.classList.toggle('sel',D.soup!=null&&(D.soup?'1':'0')===e.dataset.v));
  $$('[data-act=flavor]',root).forEach(e=>e.classList.toggle('sel',D.flavor===e.dataset.id));
  $$('[data-act=spicy]',root).forEach(e=>{const v=+e.dataset.v;e.classList.toggle('sel',D.spicy===v);e.classList.toggle('up',D.spicy!=null&&v<D.spicy)});
  $$('[data-act=friend]',root).forEach(e=>e.classList.toggle('sel',D.friend===e.dataset.id));
  $$('[data-flavstep]',root).forEach(s=>s.classList.toggle('dry',D.soup===false));
  const want=D.ing.filter(id=>all.some(x=>x.id===id));
  syncChips($('#rc-ing',root),want,all,T.rcNone);syncChips($('#ph-ing',root),want,all,null);
  const set=(id,html)=>{const e=$(id,root);if(e)e.innerHTML=html};
  const fl=c.flavors.find(f=>f.id===D.flavor),fr=c.friends.find(f=>f.id===D.friend);
  set('#rc-soup',D.soup==null?none:esc(D.soup?T.soupYes:T.soupNo));
  set('#rc-flavor',fl?esc(fl.name):none);
  set('#rc-spicy',D.spicy?`<div class="d-chs">${Array.from({length:c.spicyMax},(_,i)=>`<span class="${i<D.spicy?'f':''}">${ic('chili',34,2,i<D.spicy?'currentColor':'none')}</span>`).join('')}</div>`:none);
  set('#rc-share',D.shared&&fr?esc(T.rcShared.replace('{friend}',fr.name)):`<span style="color:#B5A6A8">${esc(T.rcNoShare)}</span>`);
  const sb=$('#share-btn',root);if(sb){sb.classList.toggle('done',!!(D.shared&&fr));const l=$('#share-lbl',root);if(l)l.textContent=(D.shared&&fr)?T.shareDone.replace('{friend}',fr.name):T.shareBtn}
  set('#fv-to',fr?`<span class="av" style="background:${esc(fr.color)}">${esc(fr.name.slice(0,1))}</span><span>${esc(fr.name)}</span>`:'');
  set('#ph-who',esc(c.meName));
  set('#ph-meta',[D.soup==null?'':(D.soup?T.soupYes:T.soupNo),fl?fl.name:'',D.spicy?('辛さ '+D.spicy):''].filter(Boolean).map(esc).join(' ／ '));
  const tot=demoTotal(c);$$('[data-tot]',root).forEach(el=>{tweenYen(el,D.tot,tot)});D.tot=tot;
}

       <div class="d-sb" data-act="soup" data-v="0"><div class="ic">${ic('bowl',120,1.7)}</div><span data-e="${tb}.soupNo">${esc(T.soupNo)}</span></div></div></div>

     <div class="d-step rv" data-at="6" data-to="6"><div class="d-h" data-e="${tb}.share">${esc(T.share)}</div><div class="d-fr">${fr}</div>

     <div class="d-step rv" data-at="7" data-to="7"><div class="d-fv">
       <div class="d-fvl"><div class="d-h" data-e="${tb}.friendTitle">${esc(T.friendTitle)}</div><div class="d-fvlab" data-e="${tb}.friendTo">${esc(T.friendTo)}</div><div class="d-fvto" id="fv-to"></div></div>
       <div class="d-phone"><div class="d-pt" data-e="${tb}.friendApp">${esc(T.friendApp)}</div>
         <div class="d-pm"><div class="av">${esc(String(c.meName).slice(0,1))}</div><div><div class="who" id="ph-who"></div><div class="msg" data-e="${tb}.friendMsg">${esc(T.friendMsg)}</div></div></div>
         <div class="d-pc"><div class="dish" data-e="${tb}.friendDish">${esc(T.friendDish)}</div><div class="d-ing" id="ph-ing"></div><div class="ph-meta" id="ph-meta"></div><div class="ph-price" data-tot>${yen(0)}</div><div class="ph-btn" data-e="${tb}.friendBtn">${esc(T.friendBtn)}</div></div>
       </div></div></div>
     <div class="d-step rv" data-at="8" data-to="8"><div class="d-rv"><div class="k" data-e="${tb}.review">${esc(T.review)}</div><div class="t" data-tot>${yen(0)}</div><div class="d-btn" role="button" tabindex="0" data-act="confirm" data-e="${tb}.confirm">${esc(T.confirm)}</div></div></div>
     <div class="d-step rv" data-at="9" data-to="9"><div class="d-rv"><div class="d-ok">${ic('check',170,2.8)}</div><div class="t" style="font-size:68px" data-e="${tb}.done">${esc(T.done)}</div><div class="t" style="font-size:150px" data-tot>${yen(0)}</div></div></div>
    </div>
    <div class="d-rc rv" data-at="1"><div class="d-rt" data-e="${tb}.rcTitle">${esc(T.rcTitle)}</div>
     <div class="d-rr"><div class="k" data-e="${tb}.rcIng">${esc(T.rcIng)}</div><div class="v"><div class="d-ing" id="rc-ing"></div></div></div>
     <div class="d-rr2"><div><div class="k" data-e="${tb}.rcSoup">${esc(T.rcSoup)}</div><div class="v" id="rc-soup"></div></div><div><div class="k" data-e="${tb}.rcFlavor">${esc(T.rcFlavor)}</div><div class="v" id="rc-flavor"></div></div></div>

  apply(root,p,st,prev,quiet){

      if(st===2&&prev===1&&D.ing.length===0){const ids=valid(pre.ingredients);D.pend=ids.slice();ids.forEach((id,i)=>D.timers.push(setTimeout(()=>{if(!D.ing.includes(id))D.ing.push(id);D.pend=(D.pend||[]).filter(x=>x!==id);demoUpdate(root,c)},450+i*330)))}
      if(st>=3&&D.pend&&D.pend.length){D.pend.forEach(id=>{if(!D.ing.includes(id))D.ing.push(id)});D.pend=null}
      if(st>=3&&D.ing.length===0)D.ing=valid(pre.ingredients);
      /* 以降のステップに進むとき、未選択なら初期値を入れる */
      if(st>=4&&D.soup==null)D.soup=!!pre.soup;
      if(st>=5&&D.flavor==null&&c.flavors.some(f=>f.id===pre.flavor))D.flavor=pre.flavor;
      if(st>=6&&D.spicy==null)D.spicy=clamp(+pre.spicy||3,1,c.spicyMax);
      if(st>=6&&D.friend==null)D.friend=defaultFriend(c);
      if(st>=7&&!D.shared)D.shared=true;
    }
    demoUpdate(root,c);
  }
};
function demoAct(a){
  const p=curPage();if(!p||p.type!=='demo')return;const c=p.content,root=$('#slide');
  const act=a.dataset.act;
  if(act==='ing'){const id=a.dataset.id;const i=D.ing.indexOf(id);if(i>=0)D.ing.splice(i,1);else D.ing.push(id)}
  else if(act==='soup')D.soup=a.dataset.v==='1';
  else if(act==='flavor')D.flavor=a.dataset.id;
  else if(act==='spicy')D.spicy=+a.dataset.v;
  else if(act==='friend')D.friend=a.dataset.id;
  else if(act==='share'){if(!D.friend)D.friend=defaultFriend(c);D.shared=true}
  else if(act==='confirm'){go(1);return}
  D.timers.forEach(clearTimeout);D.timers=[];
  demoUpdate(root,c);
}

/* =========================================================

const KEY='chilli-nabe-presentation-v3';
const stage=$('#stage'),slide=$('#slide'),ind=$('#ind'),app=$('#app');
const THEMES=[['light','白'],['blush','うすい桃色'],['red','赤'],['ink','黒']];
let saveTimer=null,memOnly=false;

const FONTS={
 maru:{name:'まるゴシック(やさしい・標準)',disp:'"Zen Maru Gothic"',body:'"Zen Maru Gothic"',dw:900},
 rounded:{name:'ポップ丸ゴ(M PLUS Rounded)',disp:'"M PLUS Rounded 1c"',body:'"M PLUS Rounded 1c"',dw:900},
 kaku:{name:'モダンゴシック(Zen Kaku Gothic)',disp:'"Zen Kaku Gothic New"',body:'"Zen Kaku Gothic New"',dw:900},
 noto:{name:'すっきりゴシック(Noto Sans JP)',disp:'"Noto Sans JP"',body:'"Noto Sans JP"',dw:900},

};
const FALL=',"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif';
function applyFont(){
  const f=FONTS[(data.settings||{}).font]||FONTS.maru,r=document.documentElement.style;
  r.setProperty('--disp',f.disp+FALL);r.setProperty('--body',f.body+FALL);r.setProperty('--dw',f.dw);
}
function fillMissing(t,s){
  for(const k in s){
    if(!(k in t))t[k]=clone(s[k]);
    else if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])&&t[k]&&typeof t[k]==='object'&&!Array.isArray(t[k]))fillMissing(t[k],s[k]);
  }
}
/* 古い保存データに、新しく増えた項目を足す (ユーザーの編集は上書きしない) */
function migrate(d){
  d.settings=Object.assign({font:'maru'},d.settings||{});
  d.images=Object.assign(clone(DEF.images),d.images||{});
  d.pages.forEach(p=>{const df=DEF.pages.find(x=>x.id===p.id);if(df&&df.type===p.type&&p.content)fillMissing(p.content,df.content)});
  if((d.v||1)<2){const demo=d.pages.find(p=>p.type==='demo');if(demo&&demo.content.text&&demo.content.text.flavor==='味を選ぼう')demo.content.text.flavor='スープの味を選ぼう'}
  if((d.v||1)<4){const m=d.pages.find(p=>p.type==='cost');if(m&&!m.content.features){const df=DEF.pages.find(x=>x.type==='cost');m.content=clone(df.content)}}
  if((d.v||1)<3&&d.images&&d.images.persona&&!d.images.persona.label)d.images.persona.label='ペルソナの写真';
  d.v=4;return d;
}
function loadLocal(){
  try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(d&&Array.isArray(d.pages)&&d.pages.length)return migrate(d)}}catch(e){memOnly=true}
  return null;
}

/* ---------- 保存 ---------- */
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(data));S.dirty=false;setStatus('保存済み '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}));return true}
  catch(e){memOnly=true;setStatus('⚠ このブラウザでは保存できません(書き出しで保管してください)');return false}
}
function dirty(){S.dirty=true;setStatus('未保存の変更あり…');clearTimeout(saveTimer);saveTimer=setTimeout(persist,600)}
function setStatus(t){const e=$('#stat');if(e)e.textContent=t}
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2600)}

const curPage=()=>data.pages.find(p=>p.id===S.pid)||data.pages[0];

/* ---------- 描画 ---------- */
function mount(opts){
  opts=opts||{};const p=curPage();if(!p)return;S.pid=p.id;

  const n=labelsOf(p).length;S.st=clamp(S.st,0,n-1);

  slide.innerHTML=hdr+T.render(p,b);
  stage.dataset.th=p.theme||'light';
  slide.classList.add('noanim');
  applyState(S.st,opts.quiet?S.st:null,!!opts.quiet);
  void slide.offsetWidth;slide.classList.remove('noanim');
  if(opts.enter){slide.classList.remove('enter-f','enter-b');void slide.offsetWidth;slide.classList.add(opts.enter==='b'?'enter-b':'enter-f')}
  updateInd();
  if(S.mode==='edit')enableInline();
  updateStbar();
}
function applyState(st,prev,quiet){
  const p=curPage(),T=PT[p.type];
  applyReveal(slide,st);
  const h=$('.hero',slide);if(h)h.classList.toggle('dock',st>0);
  if(T.apply)T.apply(slide,p,st,prev,quiet);
  S.prev=st;
}
function updateInd(){
  const p=curPage(),list=enabledPages(),i=list.findIndex(x=>x.id===p.id);
  ind.textContent=i>=0?`${p.title}   ${i+1} / ${list.length}`:`${p.title}(非表示ページ)`;
}

/* ---------- ナビゲーション: 次へ/前へ ---------- */
function go(dir){
  const p=curPage(),n=labelsOf(p).length;
  if(dir>0){
    if(S.st<n-1){const pv=S.st;S.st++;applyState(S.st,pv,false);updateStbar()}
    else{const list=enabledPages(),i=list.findIndex(x=>x.id===p.id),nx=list[i+1];if(nx){S.pid=nx.id;S.st=0;mount({enter:'f'})}}
  }else{
    if(S.st>0){const pv=S.st;S.st--;applyState(S.st,pv,false);updateStbar()}
    else{const list=enabledPages(),i=list.findIndex(x=>x.id===p.id),pr=i>0?list[i-1]:null;if(pr){S.pid=pr.id;S.st=labelsOf(pr).length-1;mount({enter:'b'})}}
  }
}
function jumpState(k){const pv=S.st;S.st=k;applyState(k,pv,false);updateStbar()}
function selectPage(id,st){S.pid=id;S.st=st||0;mount();if(S.mode==='edit'){buildList();buildInspector()}}

/* ---------- 画面フィット ---------- */
function fit(){
  const v=$('#viewport'),w=v.clientWidth,h=v.clientHeight;if(!w||!h)return;
  const s=Math.min(w/1920,h/1080);
  stage.style.transform=`scale(${s})`;
  stage.style.left=((w-1920*s)/2)+'px';stage.style.top=((h-1080*s)/2)+'px';
}
new ResizeObserver(fit).observe($('#viewport'));
window.addEventListener('resize',fit);

/* ---------- モード切替 ---------- */
function setMode(m){
  S.mode=m;app.className='m-'+m;
  if(m==='present'){const c=curPage();if(!c.enabled){const f=enabledPages()[0];if(f){S.pid=f.id;S.st=0}}}
  if(m==='edit'){buildTop();buildList();buildInspector();buildStbar()}
  fit();mount({quiet:m==='edit'});
  requestAnimationFrame(fit);
}
async function toggleFS(){

['mousemove','mousedown','touchstart'].forEach(ev=>document.addEventListener(ev,wake,{passive:true}));

/* ---------- 入力 ---------- */
stage.addEventListener('click',e=>{
  if(S.mode!=='present'){if(e.target.closest('a'))e.preventDefault();return}

document.addEventListener('keydown',e=>{
  const t=e.target,typing=t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
  if(typing){if(e.key==='Escape')t.blur();return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(S.mode==='present'){
    if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(1)}
    else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}
    else if(e.key==='Home'){const f=enabledPages()[0];if(f){S.pid=f.id;S.st=0;mount({enter:'b'})}}
    else if(e.key==='End'){const l=enabledPages().slice(-1)[0];if(l){S.pid=l.id;S.st=labelsOf(l).length-1;mount({enter:'f'})}}
    else if(e.key==='f'||e.key==='F')toggleFS();
    else if(e.key==='e'||e.key==='E')setMode('edit');
  }
});

    const ow=el('select');ow.innerHTML=c.owners.map(o=>`<option${o.name===r.owner?' selected':''}>${esc(o.name)}</option>`).join('')+(c.owners.some(o=>o.name===r.owner)?'':`<option selected>${esc(r.owner)}</option>`);ow.oninput=()=>{r.owner=ow.value;changed()};
    const dt=(k)=>{const d=el('input');d.type='date';d.value=pd(r[k])?r[k]:'';d.oninput=()=>{if(!d.value)return;r[k]=d.value;
      if(k==='start'&&pd(r.end)&&r.end<r.start){r.end=r.start;const e=$('input[data-k=end]',row);if(e)e.value=r.end}
      if(k==='end'&&pd(r.start)&&r.end<r.start){r.start=r.end;const s2=$('input[data-k=start]',row);if(s2)s2.value=r.start}
      changed()};d.dataset.k=k;return d};
    const col=el('input');col.type='color';col.value=/^#[0-9a-f]{6}$/i.test(r.color)?r.color:'#F58BA9';col.oninput=()=>{r.color=col.value;changed()};
    const top=el('div','gt-t');top.append(nm,ow,col);
    const mk=(t,ti,fn)=>{const b=el('button','btn light sm',t);b.type='button';b.title=ti;b.onclick=fn;return b};
    top.append(mk('▲','上へ',()=>{if(i>0){c.rows.splice(i-1,0,c.rows.splice(i,1)[0]);redraw()}}),mk('✕','削除',()=>{c.rows.splice(i,1);redraw()}));
    const dl=el('div','gt-d');const l1=el('label','','開始');l1.append(dt('start'));const l2=el('label','','終了');l2.append(dt('end'));dl.append(l1,l2);
    row.append(top,dl);box.append(row)});
  const add=el('button','btn light sm','＋ タスクを追加');add.type='button';add.onclick=()=>{const l=c.rows[c.rows.length-1]||{owner:(c.owners[0]||{}).name||'全員',start:'2026-10-01',end:'2026-10-14',color:'#F58BA9'};c.rows.push({name:'新しいタスク',owner:l.owner,start:l.end,end:l.end,color:l.color});redraw()};
  box.append(add);return box;
}
function readImage(file,cb){
  const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const M=1400,r=Math.min(1,M/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*r);cv.height=Math.round(im.height*r);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.85))};im.onerror=()=>toast('画像を読み込めませんでした');im.src=fr.result};fr.readAsDataURL(file);
}

/* ---------- 状態ステッパー ---------- */
function buildStbar(){$('#stbar').innerHTML=`<button class="btn sm" id="s-prev">◀ 前の状態</button><button class="btn sm" id="s-next">次の状態 ▶</button><span class="dots" id="s-dots"></span><span class="lbl" id="s-lbl"></span>`;
  $('#s-prev').onclick=()=>{if(S.st>0){jumpState(S.st-1);buildInspector()}};$('#s-next').onclick=()=>{const n=labelsOf(curPage()).length;if(S.st<n-1){jumpState(S.st+1);buildInspector()}}}
function updateStbar(){
  if(S.mode!=='edit')return;const d=$('#s-dots');if(!d)return;const ls=labelsOf(curPage());
  d.innerHTML=ls.map((l,i)=>`<button class="dot${i===S.st?' on':''}" data-i="${i}" title="${esc(l)}" aria-label="状態 ${i}: ${esc(l)}"></button>`).join('');
  $$('.dot',d).forEach(b=>b.onclick=()=>{jumpState(+b.dataset.i);buildInspector()});
  $('#s-lbl').textContent=`状態 ${S.st+1} / ${ls.length}: ${ls[S.st]}`;
  const bs=$$('.stbtns button');bs.forEach((b,i)=>b.classList.toggle('on',i===S.st));
}

/* ---------- モーダル / 書き出し・読み込み ---------- */
function modal(title,body,btns){
  const m=$('#modal'),bx=$('#mbox');bx.innerHTML=`<h3>${esc(title)}</h3>`;
  if(typeof body==='string')bx.insertAdjacentHTML('beforeend',body);else bx.append(body);
  const a=el('div','acts');(btns||[{label:'閉じる'}]).forEach(b=>{const bt=el('button','btn '+(b.cls||'light'),esc(b.label));bt.onclick=()=>{m.classList.remove('on');b.fn&&b.fn()};a.append(bt)});bx.append(a);m.classList.add('on');
}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.classList.remove('on')});
function openIO(){
  const wrap=el('div');wrap.innerHTML=`<p class="hint">発表データ全体(文章・数値・ページ順・画像)をJSONでバックアップできます。読み込むときは下の欄に貼り付けるか、ファイルを選んでください。</p><textarea id="iojson" spellcheck="false"></textarea>`;
  const ta=$('textarea',wrap);ta.value=JSON.stringify(data,null,1);
  const file=el('input');file.type='file';file.accept='.json,application/json';file.onchange=()=>{if(file.files[0]){const fr=new FileReader();fr.onload=()=>{ta.value=fr.result};fr.readAsText(file.files[0])}};wrap.append(file);
  modal('書き出し / 読み込み',wrap,[
   {label:'ダウンロード',fn:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ta.value],{type:'application/json'}));a.download='chilli-nabe-presentation.json';document.body.appendChild(a);a.click();a.remove();toast('ダウンロードを開始しました(できない場合はコピーしてください)')}},
   {label:'コピー',fn:()=>{ta.select();try{document.execCommand('copy');toast('コピーしました')}catch(e){toast('コピーできませんでした')}}},
   {label:'この内容を読み込む',cls:'pri',fn:()=>{try{const d=migrate(JSON.parse(ta.value));if(!d||!Array.isArray(d.pages)||!d.pages.length)throw 0;data=d;applyFont();S.pid=data.pages[0].id;S.st=0;persist();buildList();buildInspector();mount({quiet:true});toast('読み込みました')}catch(e){toast('読み込めませんでした。JSONの形式を確認してください')}}},
   {label:'閉じる'}]);
}

/* =========================================================
   起動
   - ブラウザに保存があればそれを使う
   - なければ presentation.json (同じフォルダ) → なければ初期内容
   - URL に ?reset を付けると、このブラウザの保存を消して読み直す
   ========================================================= */
window.__app={S,get data(){return data},go,setMode,mount,jumpState,selectPage,applyFont};
async function boot(){
  if(/[?&]reset\b/.test(location.search)){try{localStorage.removeItem(KEY)}catch(e){}}
  let d=loadLocal();
  if(!d&&location.protocol!=='file:'){
    try{
      const r=await Promise.race([fetch('presentation.json',{cache:'no-cache'}),new Promise((_,rej)=>setTimeout(rej,1500))]);
      if(r&&r.ok){const j=await r.json();if(j&&Array.isArray(j.pages)&&j.pages.length)d=migrate(j)}
    }catch(e){}
  }
  data=d||migrate(clone(DEF));
  if(!data.pages.some(p=>p.enabled))data.pages[0].enabled=true;
  S.pid=(enabledPages()[0]||data.pages[0]).id;
  applyFont();buildPbar();fit();mount();wake();
}
boot();
</script>
